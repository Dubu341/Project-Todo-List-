<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="layout">
      <div class="projectContainer">
        <h2>Projects:</h2>
        <div class="projectExpandable-container">
          <div class="projectOpenForm">Create new Project</div>
          <form action="" method="get" class="hidden projectForm">
            <h3>New Project:</h3>
            <input type="text" name="newProject" id="newProject" required />
            <button type="submit">Create</button>
            <button type="button" class="projectClose">Close</button>
          </form>
        </div>
        <div class="projects"></div>
      </div>
      <div class="todoContainer">
        <div class="todoOpenForm">Create new Todo</div>
        <div class="todoExpandable-container"></div>
        <div class="todoCard"></div>
      </div>
    </div>
  </body>
</html>
